# Windows и Linux (Electron), Android (Tauri). Собираются на серверах GitHub, когда выходит релиз
# (его создаёт ./scripts/build-mac.sh --publish), и прикладываются к тому же релизу.
# Ручной запуск: Actions → «Windows, Linux, Android» → Run workflow. С тегом (v0.9.4) — файлы уйдут
# в релиз, без тега — просто сборка текущего кода, файлы лежат в «Artifacts» на странице запуска.
name: Windows, Linux, Android

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (например v0.9.4); пусто — только проверочная сборка"
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 — чтобы .deb ставился и на старые, и на новые Ubuntu/Debian
          - os: ubuntu-22.04
            target: linux
            files: "JsMessenger-*.deb JsMessenger-*.AppImage latest-linux.yml"
          - os: windows-latest
            target: win
            files: "JsMessenger-*-Setup.exe JsMessenger-*-Setup.exe.blockmap latest.yml"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      VITE_DEFAULT_SERVER: ${{ vars.VITE_DEFAULT_SERVER }}
      VITE_LIVEKIT_SERVICE_URL: ${{ vars.VITE_LIVEKIT_SERVICE_URL }}
      # Подпись Windows через SignPath включается, когда заданы переменная SIGNPATH_ORGANIZATION_ID
      # и секрет SIGNPATH_API_TOKEN (см. docs/CODE_SIGNING.md). Без них сборка — как раньше, без подписи.
      SIGN: ${{ matrix.target == 'win' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Сборка
        run: ./scripts/build-electron.sh ${{ matrix.target }}
      # ---------- подпись Windows (SignPath): сначала программа, потом установщик с ней ----------
      - name: "Подпись: отправить программу"
        if: env.SIGN == 'true'
        id: up-app
        uses: actions/upload-artifact@v4
        with:
          name: win-app-unsigned
          path: release/electron/win-unpacked/JsMessenger.exe
          if-no-files-found: error
          retention-days: 1
      - name: "Подпись: программа (SignPath)"
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'JsMessenger' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: app-exe
          github-artifact-id: ${{ steps.up-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-app
      - name: "Подпись: установщик с подписанной программой"
        if: env.SIGN == 'true'
        run: |
          cp signed-app/JsMessenger.exe release/electron/win-unpacked/JsMessenger.exe
          rm -f release/electron/JsMessenger-*-Setup.exe release/electron/JsMessenger-*-Setup.exe.blockmap release/electron/latest.yml
          npx electron-builder --win nsis --x64 --prepackaged release/electron/win-unpacked --publish never
      - name: "Подпись: отправить установщик"
        if: env.SIGN == 'true'
        id: up-inst
        uses: actions/upload-artifact@v4
        with:
          name: win-installer-unsigned
          path: release/electron/JsMessenger-*-Setup.exe
          if-no-files-found: error
          retention-days: 1
      - name: "Подпись: установщик (SignPath)"
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'JsMessenger' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.up-inst.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installer
      - name: "Подпись: подписанный установщик и latest.yml для автообновления"
        if: env.SIGN == 'true'
        run: |
          cp signed-installer/JsMessenger-*-Setup.exe release/electron/
          node scripts/win-update-latest.mjs release/electron/JsMessenger-*-Setup.exe
      - name: "Подпись: проверка"
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          foreach ($f in @("release/electron/win-unpacked/JsMessenger.exe") + (Get-ChildItem release/electron/JsMessenger-*-Setup.exe).FullName) {
            $s = Get-AuthenticodeSignature $f
            Write-Output "::notice title=Подпись::$(Split-Path $f -Leaf) — $($s.Status), $($s.SignerCertificate.Subject)"
            if ($s.Status -ne 'Valid') { throw "Подпись недействительна: $f" }
          }

      - name: Отчёт о сборке
        run: |
          cd release/electron
          for f in JsMessenger-*.exe JsMessenger-*.deb JsMessenger-*.AppImage; do
            [ -f "$f" ] && echo "::notice title=Файл::$f — $(( $(wc -c < "$f") / 1048576 )) МБ"
          done
          ASAR=$(ls */resources/app.asar 2>/dev/null | head -1)
          [ -n "$ASAR" ] && echo "::notice title=app.asar::$(( $(wc -c < "$ASAR") / 1048576 )) МБ; $(npx --yes @electron/asar list "$ASAR" | cut -d/ -f2-3 | sort -u | grep -c node_modules/) пакетов"
          true
      - name: Приложить к релизу
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release/electron
          gh release upload "$TAG" --clobber ${{ matrix.files }}
      - name: Сохранить сборку (проверочный запуск)
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: JsMessenger-${{ matrix.target }}
          path: |
            release/electron/*.deb
            release/electron/*.AppImage
            release/electron/*.exe
            release/electron/*.yml
          retention-days: 7

  android:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      VITE_DEFAULT_SERVER: ${{ vars.VITE_DEFAULT_SERVER }}
      VITE_LIVEKIT_SERVICE_URL: ${{ vars.VITE_LIVEKIT_SERVICE_URL }}
      # ключ подписи APK: один и тот же навсегда, иначе обновление не встанет поверх
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # Android SDK на серверах GitHub уже есть ($ANDROID_HOME) — доставляем NDK и build-tools
      - name: Android NDK и Rust
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;27.2.12479018" "build-tools;35.0.0" "platforms;android-35" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Сборка APK
        run: |
          set -o pipefail
          {
            npm ci --no-audit --no-fund
            npx tauri android init --ci
            node scripts/android-patch.mjs
            npx tauri android build --apk --target aarch64 armv7 x86_64
          } 2>&1 | tee android-build.log
      - name: Ошибка сборки — последние строки журнала
        if: failure()
        run: |
          grep -v '^\s*$' android-build.log | tail -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > tail.txt || true
          echo "::error title=Журнал сборки Android::$(cat tail.txt)"
      - name: Подпись APK
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          BT="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -1)
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            PASS="$KEYSTORE_PASSWORD"
          else
            echo "::warning title=Подпись APK::Нет секретов ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD — подписано временным ключом, такой APK нельзя будет обновить"
            PASS=temporary
            keytool -genkeypair -keystore release.jks -storetype PKCS12 -alias jsmessenger -keyalg RSA -keysize 2048 \
              -validity 365 -storepass $PASS -keypass $PASS -dname "CN=JsMessenger test" > /dev/null
          fi
          mkdir -p release/android
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-key-alias jsmessenger --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --out "release/android/JsMessenger-$VERSION.apk" aligned.apk
          "$BT/apksigner" verify "release/android/JsMessenger-$VERSION.apk"
          rm -f release.jks
          echo "::notice title=Файл::JsMessenger-$VERSION.apk — $(( $(wc -c < release/android/JsMessenger-$VERSION.apk) / 1048576 )) МБ"
      - name: Приложить к релизу
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" --clobber release/android/*.apk
      - name: Сохранить сборку (проверочный запуск)
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: JsMessenger-android
          path: release/android/*.apk
          retention-days: 7
