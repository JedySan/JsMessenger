# Linux-версия: собирается на серверах GitHub, когда выходит релиз
# (его создаёт ./scripts/build-mac.sh --publish), и прикладывается к тому же релизу.
# Можно запустить и вручную: Actions → Linux → Run workflow (указать тег, например v0.8.0).
name: Linux

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, к которому приложить сборку (например v0.8.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    # 22.04 — чтобы пакет ставился и на старые, и на новые Ubuntu/Debian
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      VITE_DEFAULT_SERVER: ${{ vars.VITE_DEFAULT_SERVER }}
      VITE_LIVEKIT_SERVICE_URL: ${{ vars.VITE_LIVEKIT_SERVICE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Сборка .deb и .AppImage
        run: ./scripts/build-linux.sh
      - name: Приложить к релизу
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release/linux
          gh release upload "$TAG" --clobber \
            JsMessenger-*.deb JsMessenger-*.AppImage latest-linux.yml
