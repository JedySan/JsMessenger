# Сборка Linux- и Windows-версий (Electron): scripts/build-electron.sh linux|win → release/electron/
appId: io.github.jedysan.jsmessenger
productName: JsMessenger
copyright: "© 2026 JedySan. AGPL-3.0-or-later"
directories:
  app: electron          # main.cjs, preload.cjs, web/ (интерфейс), свой package.json
  output: release/electron
  buildResources: electron/icons
# в пакет — только собранное: main/preload одним файлом (с electron-updater внутри) и интерфейс;
# никаких node_modules (иначе сборщик на Windows подтягивает зависимости всего проекта)
files:
  - "dist/**/*"
  - "web/**/*"
  - "icons/**/*"
  - "package.json"
  - "!web/**/*.map"
  - "!**/node_modules/**"
npmRebuild: false
electronLanguages: [ru, en-US]
linux:
  target: [deb, AppImage]
  category: Network
  icon: electron/icons/icon.png
  executableName: jsmessenger
  syncDesktopName: true
  synopsis: Matrix-мессенджер со звонками
  description: Matrix-мессенджер со звонками через LiveKit (MatrixRTC) и сквозным шифрованием.
  maintainer: "JedySan <61560967+JedySan@users.noreply.github.com>"
  desktop:
    entry:
      Name: JsMessenger
      Comment: Matrix-мессенджер со звонками
      Categories: Network;InstantMessaging;Chat;
      StartupWMClass: jsmessenger
      Keywords: matrix;chat;messenger;
deb:
  depends: [libgtk-3-0, libnotify4, libnss3, libxss1, libxtst6, xdg-utils, libatspi2.0-0, libuuid1, libsecret-1-0]
win:
  target:
    - target: nsis
      arch: [x64]
  icon: electron/icons/icon.ico
  executableName: JsMessenger
  # сертификата нет — exe не подписан (SmartScreen предупредит при первом запуске);
  # значок и сведения о версии в exe всё равно прописываются
  signAndEditExecutable: true
nsis:
  # установка в профиль пользователя без прав администратора — и обновления без запросов
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: JsMessenger
  deleteAppDataOnUninstall: false
  artifactName: "JsMessenger-${version}-Setup.${ext}"
artifactName: "JsMessenger-${version}-${arch}.${ext}"
publish:
  provider: github
  owner: JedySan
  repo: JsMessenger
  releaseType: release
