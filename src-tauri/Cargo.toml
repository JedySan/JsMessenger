[package]
name = "jsmessenger"
version = "0.13.1"
description = "JsMessenger — Matrix-клиент со звонками через LiveKit"
license = "AGPL-3.0-or-later"
authors = ["JedySan"]
repository = "https://github.com/JedySan/JsMessenger"
edition = "2021"

[lib]
name = "jsmessenger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"

# только для настольных платформ
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# токен входа — в Связке ключей (macOS и iOS)
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# Уведомления macOS через UNUserNotificationCenter (см. src/notify_mac.rs)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSString", "NSError", "NSBundle", "NSObject", "NSProcessInfo"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
  "std", "bitflags", "block2",
  "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSound",
  "UNNotification", "UNNotificationResponse", "UNNotificationTrigger", "UNNotificationSettings", "UNNotificationAttachment",
] }
